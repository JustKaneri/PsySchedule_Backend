syntax = "proto3";

option csharp_namespace = "PsySchedule.GRPC";

package clients;

service ClientTelegramService {
  rpc CreateClientTelegram (ClientTelegramRequest)
      returns (ClientTelegramResponse);
}

message ClientTelegramRequest {
  string first_name = 1;
  optional string second_name = 2;
  optional string phone = 3;
  string time_zone = 4;
  TelegramData telegram_data = 5;
}

message TelegramData {
  int64 id = 1;
  optional string user_name = 2;
  optional string first_name = 3;
  optional string last_name = 4;
  optional string language_code = 5;
  int64 telegram_chat_id = 6;
}

message ClientTelegramResponse {
  bool is_success = 1;
  Error error = 2;
}

message Error {
  int32 error_code = 1;
  string error_message = 2;
}